  <script src="data.js"></script>
  <script>
    /* Theme bootstrap: set the ground before anything paints. */
    (function(){
      var slug = new URLSearchParams(location.search).get('t');
      var t = (window.TREKS || []).filter(function(x){ return x.slug === slug; })[0];
      document.documentElement.dataset.theme = (t && t.theme) || 'journal';
    })();
  </script>
  <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
</head>

  <header class="site-header">
